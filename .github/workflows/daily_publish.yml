name: 🚀 Discover Pakistan Daily Publisher

on:
  schedule:
    # Autonomous daily execution (10:00 AM PKT / 05:00 UTC)
    #- cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      city:
        description: 'Specific city or tourist destination (e.g. Hunza, Skardu, Passu, Swat, Gwadar)'
        required: false
        default: 'Hunza'
        type: string
      topic:
        description: 'Custom travel highlight or tourism fact (optional)'
        required: false
        default: ''
        type: string
      format:
        description: 'Format to generate'
        required: true
        default: 'card'
        type: choice
        options:
          - card
          - reel
          - both

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Graphics & Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick libraqm0 libfribidi0 libharfbuzz0b fonts-noto-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '1304442402758898' }}
          IG_BUSINESS_ACCOUNT_ID: ${{ vars.IG_BUSINESS_ACCOUNT_ID || '17841438750095367' }}
          SKIP_CLEANUP: "true"
        run: |
          rm -f storage/videos/*.png storage/videos/*.mp4
          
          CMD="python run_agent.py --format ${{ github.event.inputs.format || 'card' }} --once"
          if [ -n "${{ github.event.inputs.city }}" ]; then
            CMD="$CMD --city '${{ github.event.inputs.city }}'"
          fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            CMD="$CMD --topic '${{ github.event.inputs.topic }}'"
          fi
          echo "[*] Executing: $CMD"
          eval $CMD

      - name: Commit State & Blog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update autonomous blog & captions log [skip ci]"
          file_pattern: 'posts.json captions_log.jsonl index.html sitemap.xml assets/posts/*'

      - name: Cleanup Temporary Storage
        if: always()
        run: |
          rm -rf storage/videos/* latest_caption.txt
